[package]
name = "school_attendance"
version = "1.0.0"
description = "Offline Arabic school attendance desktop app"
authors = ["School Attendance Project"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=1.5.1", features = [] }

[dependencies]
tauri = { version = "=1.8.3", features = ["windows7-compat", "dialog-save", "dialog-open"] }
rusqlite = { version = "=0.31.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
chrono = { version = "=0.4.35", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.24.1"
objc = "=0.2.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
